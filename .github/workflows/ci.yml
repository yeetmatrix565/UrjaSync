name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: web (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  android:
    name: android (assemble debug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      # The APK bundles the dashboard, and the Gradle build fails loudly if the
      # export is missing - so the web build has to run first.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The action's default `packages` is "tools platform-tools", but the legacy
      # "tools" package has been removed from Google's repository - sdkmanager
      # fails with "Failed to find package 'tools'" and the step dies before
      # Gradle ever runs. Install exactly what this build needs instead; these IDs
      # are what `sdkmanager --list_installed` reports on the dev machine.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleDebug --no-daemon
